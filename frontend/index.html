<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mars Haritası — Jezero Güvenli Rota</title>

  <!-- Leaflet 1.9.4, CDN'den sabit sürüm. "integrity" hash'i dosyanın
       değiştirilmediğini tarayıcıya doğrulatır (hash'ler curl ile kontrol edildi). -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
          integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>

  <style>
    /* Harita tüm pencereyi kaplasın */
    html, body { height: 100%; margin: 0; font-family: system-ui, sans-serif; }
    #map { height: 100%; background: #1b1b1b; }

    /* Sol alttaki durum/bilgi kutusu. 15 px: projektörde uzaktan okunsun. */
    .durum-kutusu {
      background: rgba(255, 255, 255, 0.96);
      padding: 8px 12px; border-radius: 6px; max-width: 320px;
      box-shadow: 0 1px 4px rgba(0, 0, 0, 0.4); font-size: 15px; line-height: 1.4;
    }
    .durum-kutusu.hata { background: #fde2e2; color: #8a1010; font-weight: 600; }
    .durum-kutusu.yukleniyor { background: #fff3c4; font-weight: 600; }
    /* "Hesaplanıyor" sırasında dönen küçük halka (resim/kütüphane gerektirmez) */
    .durum-kutusu.yukleniyor::before {
      content: ""; display: inline-block; width: 14px; height: 14px; margin-right: 8px;
      vertical-align: -2px; border: 3px solid #b38f00; border-top-color: transparent;
      border-radius: 50%; animation: don 0.8s linear infinite;
    }
    @keyframes don { to { transform: rotate(360deg); } }
    /* Hesaplanırken fare imleci de "bekleniyor" olsun */
    .leaflet-container.rota-hesaplaniyor { cursor: progress; }
    /* Katman paneli yazısı biraz daha büyük */
    .leaflet-control-layers { font-size: 14px; }

    /* Eğim katmanı: 20 m'lik hücreler yumuşatılmadan görünsün */
    .egim-katmani { image-rendering: pixelated; }
    /* Eğim lejantı (sağ alt) */
    .egim-lejant .baslik { font-weight: 600; margin-bottom: 4px; }
    .egim-lejant .kare { display: inline-block; width: 14px; height: 14px; margin-right: 6px;
                         vertical-align: -2px; border: 1px solid rgba(0,0,0,.3); }

    /* Rota özeti: başlık + etiket/değer satırları */
    .rota-ozeti { min-width: 230px; }
    .rota-ozeti .baslik { font-weight: 600; margin-bottom: 4px; border-left: 4px solid #00b8d4; padding-left: 6px; }
    .rota-ozeti .metrik { display: flex; align-items: baseline; gap: 6px; padding: 2px 0; }
    .rota-ozeti .etiket { color: #555; min-width: 88px; }
    .rota-ozeti .metrik b { font-size: 16px; white-space: nowrap; }
    /* Notlar #888 yerine #666: beyaz zeminde projektörde de okunur kontrast */
    .rota-ozeti .not { color: #666; font-size: 12px; }
    .rota-ozeti .ipucu { color: #555; font-size: 13px; margin-top: 4px; }

    /* Dar ekran (telefon): kutular üst üste binmesin, harita görünür kalsın */
    @media (max-width: 600px) {
      .durum-kutusu { font-size: 14px; max-width: calc(100vw - 40px); }
      .rota-ozeti { min-width: 0; }
      .rota-ozeti .not { display: none; }          /* yer kazanmak için ek notlar gizli */
      .egim-lejant { font-size: 12px; padding: 6px 8px; }
      .egim-lejant .baslik { display: none; }
      .egim-lejant .kare { width: 12px; height: 12px; }
      /* Uzun kredi satırı (kısaltılamaz: kullanım politikası tam metni istiyor)
         en altta tam genişlikte durur; sol alttaki ölçek ve rota kutusu onun
         üstüne itilir, böylece hiçbiri birbirinin üstüne binmez. */
      .leaflet-bottom.leaflet-right { left: 0; }
      .leaflet-control-attribution { font-size: 10px; line-height: 1.3; text-align: right; white-space: normal; }
      .leaflet-bottom.leaflet-left { bottom: 30px; }
    }

    /* Bilim noktası popup'ı */
    .bilim-popup h3 { margin: 0 0 6px; font-size: 15px; }
    /* Resim kutusu sabit 4:3: popup açılırken boyutu belli olsun (kaydırma doğru çalışsın).
       scale-down: küçük resimler (ör. 128 px) büyütülüp bulanıklaşmaz, büyükler sığdırılır. */
    .bilim-popup img { width: 100%; aspect-ratio: 4 / 3; object-fit: scale-down;
                       background: #222; border-radius: 4px; display: block; }
    .bilim-popup p { margin: 6px 0; }
    .bilim-popup .kucuk { font-size: 11px; color: #555; }
  </style>
</head>
<body>
  <div id="map"></div>

  <!-- Sıra önemli: önce ayarlar, sonra uygulama -->
  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
